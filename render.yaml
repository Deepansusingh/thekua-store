services:
  # 1. Go Backend Web Service
  - type: web
    name: thekua-backend
    env: go
    buildCommand: cd backend && go build -o main ./cmd/main.go
    startCommand: cd backend && ./main
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: thekua-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: thekua-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: thekua-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: thekua-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: thekua-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. Frontend Static Site
  - type: static
    name: thekua-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: thekua-backend
          type: web
          property: host

databases:
  # 3. PostgreSQL Database
  - name: thekua-db
    databaseName: thekua_store
    user: thekua_user
    plan: free
