services:
  # 1. Go Backend Web Service
  - type: web
    name: thekua-backend
    env: go
    buildCommand: cd backend && go build -o main ./cmd/main.go
    startCommand: cd backend && ./main
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: thekua-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: thekua-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: thekua-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: thekua-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: thekua-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # 2. Frontend Static Site
  - type: web
    name: thekua-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://thekua-backend.onrender.com

databases:
  # 3. PostgreSQL Database
  - name: thekua-db
    databaseName: thekua_store
    user: thekua_user
    plan: free
