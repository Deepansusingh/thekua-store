version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: thekua_db
    environment:
      POSTGRES_USER: ${DB_USER:-thekua_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-thekua_password_123}
      POSTGRES_DB: ${DB_NAME:-thekua_store}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - thekua-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-thekua_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thekua_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-thekua_user}
      DB_PASSWORD: ${DB_PASSWORD:-thekua_password_123}
      DB_NAME: ${DB_NAME:-thekua_store}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "8080:8080"
    networks:
      - thekua-network
    volumes:
      - ./backend:/app
    command: go run ./cmd/main.go

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thekua_frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_APP_NAME: ${VITE_APP_NAME:-Thekua Store}
    ports:
      - "3000:3000"
    networks:
      - thekua-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    container_name: thekua_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - thekua-network

volumes:
  postgres_data:

networks:
  thekua-network:
    driver: bridge
